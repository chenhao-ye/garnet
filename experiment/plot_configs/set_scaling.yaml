# Plot: set_scaling
# Online SET throughput vs. client threads. Two curves:
#   - no_aof: AOF disabled (online_set)
#   - aof_single: single physical sublog, null-device AOF (online_set_aof)
# Dependency role keys map to plot_style entries (color_map, labels_map, ...).

name: set_scaling
description: "Online SET throughput: no AOF vs. single-log AOF."

dependencies:
  no_aof: online_set
  aof_single: online_set_aof

scale: 0.5
xticks: [1, 8, 16, 32, 64]
yticks: [0, 20, 40, 60, 80, 100]
legend_separate: true
