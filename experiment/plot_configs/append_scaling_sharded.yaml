# Plot: append_scaling_sharded
# Append throughput vs. primary worker threads, one curve per
# aof_physical_sublog_count, EnqueueSharded workload (sec:6.2).
# The NoPrefix dependency adds one upper-bound curve at the highest
# sublog count (default max(APPEND_M_VALUES); override with `noprefix_m`).

name: append_scaling_sharded
description: "Append throughput vs. threads, EnqueueSharded (sec:6.2)."
template: append

# Order: [MultiLog 2-D sweep, NoPrefix 2-D sweep]
dependencies: [aof_enqueue_sharded, aof_enqueue_sharded_noprefix]

scale: 0.5
xlabel: "#append threads"
xticks: [1, 8, 16, 32, 64]
xmin: 0   # start axis at 0 (xticks stay 1..64)
yticks: [0, 100, 200, 300, 400]
legend_separate: true
