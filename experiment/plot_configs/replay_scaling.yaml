# Plot: replay_scaling
# Replay throughput vs. number of sublogs (evaluation plan v3, sec:6.3).
# Four curves on a single axis:
#   - Single Log: horizontal dashed reference (m=1 from the physical config)
#   - MultiLog-virtual: m=1, n varies (virtual sweep)
#   - MultiLog-physical: n=1, m varies (physical sweep)
#   - NoPrefix: physical sweep without prefix-consistent reads (upper bound)

name: replay_scaling
description: "Replay throughput vs. number of sublogs (sec:6.3)."
template: replay

# Order: [physical sweep, virtual sweep, physical NoPrefix sweep]
dependencies: [aof_replay_physical, aof_replay_virtual, aof_replay_physical_noprefix]

scale: 0.5
xticks: [1, 8, 16, 32, 64]
yticks: [0, 20, 40, 60, 80, 100]
legend_separate: true
legend_scale: 0.5
