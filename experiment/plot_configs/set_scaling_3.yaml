# Plot: set_scaling_3
# Online SET throughput vs. client threads. Two curves plus a reference line:
#   - no_aof: AOF disabled (online_set)
#   - aof_single: single physical sublog, null-device AOF (online_set_aof)
#   - gray dashed hline: single-threaded replay capacity (see below)
# Motivates the gap: primary write throughput far exceeds what one replay
# thread can absorb. Dependency role keys map to plot_style entries.

name: set_scaling_3
description: "Online SET throughput: no AOF vs. single-log AOF, with single-threaded replay capacity."
template: set

dependencies: [online_set, online_set_aof]

scale: 0.5
xticks: [1, 8, 16, 32, 64]
xmin: 0   # start axis at 0 (xticks stay 1..64)
yticks: [0, 20, 40, 60, 80, 100]
legend_separate: true
legend_ncol: 3   # single row: 2 curves + capacity hline

# Gray dashed reference line: single-threaded replay capacity, pulled live from
# the aof_replay_physical run with a single physical sublog (= one replay thread).
replay_capacity_hline:
  experiment: aof_replay_physical
  filter: { client.aof_physical_sublog_count: 1 }
  label: "Log replay"
