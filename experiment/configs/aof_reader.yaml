# Experiment: aof_reader
# Sweep AOF physical sublog count with a single in-proc reader running alongside
# ReplayDirect. Switches the bench to single-pass mode (first replay worker to
# exhaust pages signals stop; reader drains). In-proc readers execute inside the
# bench process (RespServerSession direct calls), so this config runs the default
# Combined role -- it is the protocol microscope, complementary to the
# split-process aof_reader_gcs.
# The reader keys are always Zipf; the replay distribution is swept across
# {Uniform, ZipfRev, Zipf}, so against the zipf reader each m gives the three
# alignment regimes: misaligned-by-uniform (Uniform), misaligned-by-reversal
# (ZipfRev, equal skew but disjoint hot set), and aligned (Zipf, the Z/Z stress
# case). Barrier spin is pinned to forever (-1, never sleep), matching the
# aof_reader_gcs family; with the replay-driven drift gate on by default,
# the pure-sleep default would collapse replay at m >= 16.

name: aof_reader
description: "Scale AOF physical sublog count (1-32) with one in-proc zipf reader during ReplayDirect, sweeping replay distribution {Uniform, ZipfRev, Zipf}"
benchmark: aof
no_server: true
repeat: 7

affinity:
  client:
    numa_node: 0

base:
  client_params:
    aof_bench: true
    aof_bench_type: ReplayDirect
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 10000000
    aof_gen_pages: 256
    aof_replay_reader: 1
    aof_barrier_spin_us: -1
    aof_replay_drift_threshold: 10000
    aof_replay_drift_check_freq: 1
    aof_read_dist: Zipf

sweep:
  client_params:
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32]
    aof_replay_dist: [Uniform, ZipfRev, Zipf]
