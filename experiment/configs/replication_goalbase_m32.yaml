# Experiment: replication_goalbase_m32
# Single-point extension of replication_goalbase to m=32. Same load and defaults:
# 64 writers itp=256, 1 reader itp=256, 30s, repeat 3. Kept separate so the
# baseline m {1,8,16} results are not overwritten.
name: replication_goalbase_m32
description: "goalbase point m=32, 64w/1r itp=256, defaults, 30s"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node0, ip: 10.10.1.1 }
  client:  { ssh: node2, ip: 10.10.1.3 }
affinity:
  primary: { numa_node: 0 }
  replica: { numa_node: 1 }
base:
  primary_params: { port: 7379, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m }
  replica_params:  { port: 7380, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m, aof_replay_task_count: 1 }
  client_params:   { replication_bench: true, client: GarnetClientSession, primary_port: 7379, replica_port: 7380, keylength: 8, valuelength: 8, dbsize: 1000000, replication_writers: 64, replication_readers: 1, itp: 256, runtime: 30 }
sweep_combo:
  - primary_params: { aof_physical_sublog_count: 32 }
    replica_params: { aof_physical_sublog_count: 32 }
