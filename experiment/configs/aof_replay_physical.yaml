# Experiment: aof_replay_physical
# Sweep the number of AOF physical sublogs (1, 2, 4, 8, 16, 32) using
# the offline AofBench in Replay mode with main-memory replication
# (--aof-null-device, InProc client).
# No external Garnet server is needed - AofBench creates an embedded server.

name: aof_replay_physical
description: "Scale AOF physical sublog count (1-64) for replay with main-memory replication (null device, InProc)"
benchmark: aof
no_server: true
repeat: 7

base:
  client_params:
    aof_bench: true
    aof_bench_type: ReplayDirect
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 1000000

sweep:
  client_params:
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32, 64]
