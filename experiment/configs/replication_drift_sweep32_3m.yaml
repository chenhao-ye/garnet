# Experiment: replication_drift_sweep32_3m
# Same drift-threshold sweep as replication_drift_sweep32_big (m=32, 1g buffers,
# ship 512m, replica throttle 256m) but with each role on its own machine and NO
# numa pinning: primary=node0, replica=node1, client=node2, 144 logical cores per
# role. Isolates CPU/memory-bandwidth sharing effects from the barrier's cost: if
# below-knee arms recover here relative to the co-located runs, resource sharing
# contributes to the live replay ceiling; if the curve matches, the barrier and
# feed jitter own it entirely.
name: replication_drift_sweep32_3m
description: "3-machine drift sweep at m=32, no pinning, 1g buffers, ship 512m, replica 256m, 64w/1r itp=256, 30s"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node1, ip: 10.10.1.2 }
  client:  { ssh: node2, ip: 10.10.1.3 }
base:
  primary_params: { port: 7379, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 1g, aof_physical_sublog_count: 32, aof_ship_max_lag: 536870912 }
  replica_params:  { port: 7380, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 1g, aof_replay_task_count: 1, aof_physical_sublog_count: 32, replica_offset_max_lag: 268435456 }
  client_params:   { replication_bench: true, client: GarnetClientSession, primary_port: 7379, replica_port: 7380, keylength: 8, valuelength: 8, dbsize: 1000000, replication_writers: 64, replication_readers: 1, itp: 256, runtime: 30 }
sweep_combo:
  - replica_params: { aof_replay_drift_threshold: 10000 }
  - replica_params: { aof_replay_drift_threshold: 240000 }
  - replica_params: { aof_replay_drift_threshold: 720000 }
  - replica_params: { aof_replay_drift_threshold: 2400000 }
  - replica_params: { aof_replay_drift_threshold: 4800000 }
