# Experiment: online_set
# Online Resp.benchmark with GarnetClientSession and AOF disabled on the server.
# 100% SET workload over a 1M-key dbsize; sweep client thread (session) count
# from 1 to 64. Companion to online_set_aof, which enables a null-device AOF
# with manual commit to isolate the cost of the AOF code path.

name: online_set
description: "Online 100% SET with GarnetClientSession, AOF disabled; sweep threads 1-64"
benchmark: online

base:
  client_params:
    client: GarnetClientSession
    online: true
    op_workload: [SET]
    op_percent: [100]
    keylength: 8
    valuelength: 8
    dbsize: 1000000
    runtime: 60
    itp: 32768
    disable_console_logger: true
  server_params:
    aof_memory: 256m

sweep:
  client_params:
    threads: [1, 2, 4, 8, 16, 32, 64]

plot:
  xticks: [1, 8, 16, 32, 64]
  yticks: [0, 10, 20, 30, 40, 50, 60]
  legend_separate: true
  scale: 0.5
