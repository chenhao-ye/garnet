# Mixed-load replication, MultiLog timestamp protocol, 10% writes. 32 primary-side clients issue
# a mix (10% SET / 90% GET to the primary), 32 readers on the replica. Drift threshold fixed at
# 50k; sweep m (physical sublogs) 1..32. Only the SET fraction ships AOF records, so lag is
# driven by the absolute SET rate, not the client op rate. performance governor pinned by run.py.
name: replication_mixed_w10_pzipfrev
description: "Mixed-load TS 10% writes: m{1,2,4,8,16,32}, drift=50k, 32 primary clients + 32 replica readers, zipfrev/zipf, 10M, 30s x3"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node1, ip: 10.10.1.2 }
  client:  { ssh: node2, ip: 10.10.1.3 }
base:
  primary_params:
    port: 7379
    cluster: true
    aof: true
    aof_null_device: true
    fast_aof_truncate: true
    aof_commit_freq: -1
    repl_diskless_sync: true
    aof_memory: 1g
    replica_sync_delay: 1
    aof_ship_max_lag: 268435456
  replica_params:
    port: 7380
    cluster: true
    aof: true
    aof_null_device: true
    fast_aof_truncate: true
    aof_commit_freq: -1
    repl_diskless_sync: true
    aof_memory: 1g
    aof_replay_task_count: 1
    aof_replay_drift_threshold: 50000
    aof_replay_drift_check_freq: 1
    replica_sync_delay: 1
    replica_offset_max_lag: 268435456
  client_params:
    replication_bench: true
    client: GarnetClientSession
    primary_port: 7379
    replica_port: 7380
    keylength: 8
    valuelength: 8
    dbsize: 10000000
    replication_writers: 32
    replication_readers: 32
    replication_write_ratio: 0.10
    itp: 256
    runtime: 30
    replication_write_dist: ZipfRev
    replication_read_dist: Zipf
sweep:
  server_params:                 # m coupled to BOTH primary and replica
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32]
