# Experiment: aof_enqueue_random_noprefix
# Counterpart to aof_enqueue_random with prefix consistency disabled (NoPrefix
# baseline). Throughput delta vs aof_enqueue_random isolates the cost of the
# sequence-number generator and the sharded-header byte tax on the write path.

name: aof_enqueue_random_noprefix
description: "2-D sweep: thread count (1-64) x physical sublog count (1-64) for EnqueueRandom with NoPrefix"
benchmark: aof
no_server: true
repeat: 7

affinity:
  client:
    numa_node: 0

base:
  client_params:
    aof_bench: true
    aof_bench_type: EnqueueRandom
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 1000000
    disable_prefix_consistency: true

sweep:
  client_params:
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32, 64]
    threads: [1, 2, 4, 8, 16, 32, 64]

plot:
  xticks: [1, 8, 16, 32, 64]
  yticks: [0, 20, 40, 60, 80]
  legend_separate: true
  scale: 0.5
