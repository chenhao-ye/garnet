# Experiment: online_set_itp
# Online Resp.benchmark with GarnetClientSession at fixed 64 threads (= 64
# sessions), AOF disabled. Sweeps intra-thread parallelism (itp) to locate the
# point at which per-session pipelining saturates throughput. Each run uses a
# 30s window; the 100% SET workload, 1M-key uniform keyspace, and 8B keys/
# values match online_set so results are directly comparable.

name: online_set_itp
description: "Sweep itp at threads=64 to find throughput saturation point"
benchmark: online

affinity:
  server:
    numa_node: 0
  client:
    numa_node: 1

base:
  client_params:
    client: GarnetClientSession
    online: true
    op_workload: [SET]
    op_percent: [100]
    keylength: 8
    valuelength: 8
    dbsize: 1000000
    runtime: 60
    threads: 64
    disable_console_logger: true
  server_params:
    aof_memory: 256m

sweep:
  client_params:
    itp: [1024, 4096, 8192, 16384, 32768, 65536, 131072]
