# Experiment: replication_m_sweep_32w
# Honest m-scaling at halved write load (32 writers) on the deployment-validated
# configuration: 3 machines (primary=node0, replica=node1, client=node2, no pinning),
# fine feed (replica-sync-delay 1ms, 256k chunks), drift threshold 600us (1440000 TSC
# ticks; inactive at m=1), 1g buffers, ship budget 512m, replica throttle 256m/sublog.
name: replication_m_sweep_32w
description: "3-machine honest m sweep {1..32}, 32 writers, fine feed, drift 600us, 30s"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node1, ip: 10.10.1.2 }
  client:  { ssh: node2, ip: 10.10.1.3 }
base:
  primary_params: { port: 7379, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 1g, aof_ship_max_lag: 536870912, replica_sync_delay: 1, aof_replication_chunk_size: 262144 }
  replica_params:  { port: 7380, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 1g, aof_replay_task_count: 1, replica_offset_max_lag: 268435456, replica_sync_delay: 1, aof_replication_chunk_size: 262144, aof_replay_drift_threshold: 1440000 }
  client_params:   { replication_bench: true, client: GarnetClientSession, primary_port: 7379, replica_port: 7380, keylength: 8, valuelength: 8, dbsize: 1000000, replication_writers: 32, replication_readers: 1, itp: 256, runtime: 30 }
sweep_combo:
  - primary_params: { aof_physical_sublog_count: 1 }
    replica_params: { aof_physical_sublog_count: 1 }
  - primary_params: { aof_physical_sublog_count: 2 }
    replica_params: { aof_physical_sublog_count: 2 }
  - primary_params: { aof_physical_sublog_count: 4 }
    replica_params: { aof_physical_sublog_count: 4 }
  - primary_params: { aof_physical_sublog_count: 8 }
    replica_params: { aof_physical_sublog_count: 8 }
  - primary_params: { aof_physical_sublog_count: 16 }
    replica_params: { aof_physical_sublog_count: 16 }
  - primary_params: { aof_physical_sublog_count: 32 }
    replica_params: { aof_physical_sublog_count: 32 }
