# Experiment: replication_goalbase
# Baseline for the goal "m=8/16 reader tput ~= m=1". Default chunk (1MB) / sync (5ms) /
# barrier (10000). 64 writers itp=256, 16 readers itp=256, 30s. m {1,8,16}. m=1 is the
# single-log gold standard (same-sublog fast path -> reads never block).
name: replication_goalbase
description: "baseline m {1,8,16}, 64w/1r itp=256, defaults, 30s"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node0, ip: 10.10.1.1 }
  client:  { ssh: node2, ip: 10.10.1.3 }
affinity:
  primary: { numa_node: 0 }
  replica: { numa_node: 1 }
base:
  primary_params: { port: 7379, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m }
  replica_params:  { port: 7380, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m, aof_replay_task_count: 1 }
  client_params:   { replication_bench: true, client: GarnetClientSession, primary_port: 7379, replica_port: 7380, keylength: 8, valuelength: 8, dbsize: 1000000, replication_writers: 64, replication_readers: 1, itp: 256, runtime: 30 }
sweep_combo:
  - primary_params: { aof_physical_sublog_count: 1 }
    replica_params: { aof_physical_sublog_count: 1 }
  - primary_params: { aof_physical_sublog_count: 8 }
    replica_params: { aof_physical_sublog_count: 8 }
  - primary_params: { aof_physical_sublog_count: 16 }
    replica_params: { aof_physical_sublog_count: 16 }
