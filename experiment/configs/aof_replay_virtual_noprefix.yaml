# Experiment: aof_replay_virtual_noprefix
# Counterpart to aof_replay_virtual with prefix consistency disabled (NoPrefix
# baseline). Throughput delta isolates the cost of sketch maintenance and the
# 3-phase read protocol on the replay path at varying replay task counts.

name: aof_replay_virtual_noprefix
description: "Scale AOF replay task count (1-64) under NoPrefix"
benchmark: aof
no_server: true
repeat: 7

affinity:
  client:
    numa_node: 0

base:
  client_params:
    aof_bench: true
    aof_bench_type: ReplayDirect
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 10000000
    disable_prefix_consistency: true

sweep:
  client_params:
    aof_replay_task_count: [1, 2, 4, 8, 16, 32, 64]
