# aof_reader variant: zipf on both paths -- zipf-generated AOF records AND zipf
# reader GETs over the same global hotness order (readers hammer the keys the
# replay keeps rewriting; the protocol stress case). Same sweep/settings as
# aof_reader otherwise.
name: aof_reader_zipf_both
description: Scale AOF physical sublog count (1-32) with one in-proc reader during ReplayDirect, zipf replay records and reader keys
benchmark: aof
no_server: true
repeat: 7
affinity:
  client:
    numa_node: 0
base:
  client_params:
    aof_bench: true
    aof_bench_type: ReplayDirect
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 10000000
    aof_gen_pages: 256
    aof_replay_reader: 1
    aof_barrier_spin_us: -1
    aof_replay_dist: Zipf
    aof_read_dist: Zipf
sweep:
  client_params:
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32]
