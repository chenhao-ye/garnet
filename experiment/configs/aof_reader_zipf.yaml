name: aof_reader_zipf
description: "Scale AOF physical sublog count (1-32) with one in-proc zipf reader during ReplayDirect; replay distribution Zipf (aligned Z/Z stress case)"
benchmark: aof
no_server: true
repeat: 7

affinity:
  client:
    numa_node: 0

base:
  client_params:
    aof_bench: true
    aof_bench_type: ReplayDirect
    cluster: true
    aof_null_device: true
    client: InProc
    aof_commit_freq: -1
    aof_memory_size: 256m
    keylength: 8
    valuelength: 8
    dbsize: 10000000
    aof_gen_pages: 256
    aof_replay_reader: 1
    aof_barrier_spin_us: -1
    aof_replay_drift_threshold: 10000
    aof_replay_drift_check_freq: 1
    aof_read_dist: Zipf
    aof_replay_dist: Zipf

sweep:
  client_params:
    aof_physical_sublog_count: [1, 2, 4, 8, 16, 32]
