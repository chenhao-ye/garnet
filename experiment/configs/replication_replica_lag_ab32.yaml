# Experiment: replication_replica_lag_ab32
# Isolate the replica-side throttle at m=32: aof-ship-max-lag disabled in BOTH arms
# (the gate A/B already showed off ~= on at 6g), sweeping replica-offset-max-lag
# 64m vs 192m per sublog. If honest writer throughput scales with the allowance,
# the ~11M ceiling of the both-knobs config is throttle mechanics (spin/granularity),
# not replay capacity (32-way replay microbenches at ~90M).
name: replication_replica_lag_ab32
description: "A/B replica-offset-max-lag {64m,192m} at m=32, gate off, 64w/1r itp=256, 30s"
benchmark: replication
no_server: true
repeat: 3
remote:
  primary: { ssh: node0, ip: 10.10.1.1 }
  replica: { ssh: node0, ip: 10.10.1.1 }
  client:  { ssh: node2, ip: 10.10.1.3 }
affinity:
  primary: { numa_node: 0 }
  replica: { numa_node: 1 }
base:
  primary_params: { port: 7379, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m, aof_physical_sublog_count: 32 }
  replica_params:  { port: 7380, cluster: true, aof: true, aof_null_device: true, fast_aof_truncate: true, aof_commit_freq: -1, repl_diskless_sync: true, aof_memory: 256m, aof_replay_task_count: 1, aof_physical_sublog_count: 32 }
  client_params:   { replication_bench: true, client: GarnetClientSession, primary_port: 7379, replica_port: 7380, keylength: 8, valuelength: 8, dbsize: 1000000, replication_writers: 64, replication_readers: 1, itp: 256, runtime: 30 }
sweep_combo:
  - replica_params: { replica_offset_max_lag: 67108864 }
  - replica_params: { replica_offset_max_lag: 201326592 }
